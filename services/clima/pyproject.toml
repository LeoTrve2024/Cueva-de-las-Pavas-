[project]
name = "pavas-clima"
version = "0.1.0"
description = "Base del microservicio meteorologico de Cueva de las Pavas"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0,<1.21.0",
    "fastapi>=0.142.2,<0.142.3",
    "httpx>=0.28.1,<0.28.2",
    "psycopg[binary]>=3.3.6,<3.4.0",
    "pydantic>=2.13.5,<2.14.0",
    "pydantic-settings>=2.15.0,<2.16.0",
    "sqlalchemy>=2.1.1,<2.2.0",
    "uvicorn[standard]>=0.54.0,<0.54.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pavas_clima"]
